[build-system]
requires = ["setuptools>=68", "setuptools-git-versioning >=2.0,<3"]
build-backend = "setuptools.build_meta"

[project]
name = "cmsend"
readme = "README.md"
description = "send end-to-end encrypted messages to chats on chatmail relays"
requires-python = ">=3.11"
dependencies = [
  # core 2.38.0 removed "contacts" from FullChat, stay safely above it
  "deltachat-rpc-server>=2.57.0",
  "deltachat-rpc-client>=2.57.0",
  "xdg-base-dirs>=6.0.2", 
]

dynamic = ["version"]

[tool.setuptools-git-versioning]
enabled = true

[tool.setuptools]
py-modules = ["cmsend"]


[project.urls]
Repository = "https://github.com/chatmail/cmsend"
Changelog = "https://github.com/chatmail/cmsend/blob/main/CHANGELOG.md"

[project.scripts]
cmsend = "cmsend:main"

[dependency-groups]
test = [
  "pytest",
  "pytest-timeout",
  "execnet", # imported by the deltachat_rpc_client pytest plugin
]

[tool.pytest.ini_options]
addopts = "-v -ra --strict-markers"
# cmsend waits for core events without a deadline of its own.
timeout = 180

[tool.ruff]
lint.select = [
  "F", # Pyflakes
  "I", # isort

  "PLC", # Pylint Convention
  "PLE", # Pylint Error
  "PLW", # Pylint Warning
]
lint.ignore = [
  "PLC0415" # import-outside-top-level
]
